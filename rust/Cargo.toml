[package]
authors = ["Scott Bedard"]
description = "A library for Gliński's hexagonal chess, and the brain of hexchess.club"
edition = "2021"
license = "MIT"
name = "hexchess"
readme = "README.md"
repository = "https://github.com/scottbedard/hexchess"
version = "2.2.1"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bench]]
harness = true
name = "knight"
path = "bench/knight.rs"

[[bench]]
harness = true
name = "initial_position"
path = "bench/initial_position.rs"

[features]
default = []

[dependencies]
hexchess_bitmask = { path = "./hexchess_bitmask" }
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.12.0"
smallvec = "1.11"

[profile.bench]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
