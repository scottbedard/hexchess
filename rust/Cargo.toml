[package]
authors = ["Scott Bedard"]
description = "A library for Gliński's hexagonal chess, and the brain of hexchess.club"
edition = "2021"
license = "MIT"
name = "hexchess"
readme = "README.md"
repository = "https://github.com/scottbedard/hexchess"
version = "2.1.2"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bench]]
harness = true
name = "knight"
path = "bench/knight.rs"

[[bench]]
harness = true
name = "initial_position"
path = "bench/initial_position.rs"

[features]
default = []

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_with = "3.12.0"
serde_json = "1.0.140"

[profile.bench]
opt-level = 3

[profile.release]
opt-level = 3
