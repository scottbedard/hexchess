[package]
authors = ["Scott Bedard"]
description = "A library for Gliński's hexagonal chess, and the brain of hexchess.club"
edition = "2021"
license = "MIT"
name = "hexchess"
readme = "README.md"
repository = "https://github.com/scottbedard/hexchess"
version = "2.3.0"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bench]]
harness = true
name = "bench_initial_position"
path = "benches/bench_initial_position.rs"

[[bench]]
harness = true
name = "bench_iter_bits"
path = "benches/bench_iter_bits.rs"

[features]
default = []

[dependencies]
bitvec = "1.0.1"
hexchess_bitmask = { path = "./hexchess_bitmask", version = "0.1.0" }
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"

[profile.bench]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
